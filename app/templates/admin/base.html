<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USMA Admin Panel</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

    <!-- CSS Reset & Variables (MUST HAVE!) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_tables.css') }}">

    <!-- Flatpickr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
</head>

<body class="admin-page">

    <!-- Admin Navigation Tabs -->
    <nav class="admin-nav-tabs">
        <a href="{{ url_for('dashboard.dashboard_page') }}"
            class="{% if 'dashboard' in request.endpoint %}active{% endif %}">
            📊 Dashboard
        </a>

        <a href="{{ url_for('players.players_page') }}" class="{% if 'players' in request.endpoint %}active{% endif %}">
            ⚽ Players
        </a>

        <a href="{{ url_for('clubs.clubs_page') }}" class="{% if 'clubs' in request.endpoint %}active{% endif %}">
            🏛️ Clubs
        </a>

        <a href="{{ url_for('player_club.player_club_page') }}"
            class="{% if 'player_club' in request.endpoint %}active{% endif %}">
            🔗 Player Clubs
        </a>

        <a href="{{ url_for('player_season.player_season_page') }}"
            class="{% if 'player_season' in request.endpoint %}active{% endif %}">
            📅 Player Seasons
        </a>

        <a href="{{ url_for('cities.cities_page') }}" class="{% if 'cities' in request.endpoint %}active{% endif %}">
            🏙️ Cities
        </a>

        <a href="{{ url_for('main.home') }}" style="margin-left: auto;">
            👁️ View Site
        </a>
    </nav>

    <!-- Admin Container -->
    <div class="admin-container">
        {% block content %}
        {% endblock %}
    </div>
    <!-- تهيئة جميع حقول التاريخ -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // تهيئة جميع حقول التاريخ تلقائياً
            const dateInputs = document.querySelectorAll('input[type="text"][name*="date"], input[type="text"][name*="birth"], input[type="text"][name*="Date"]');

            dateInputs.forEach(input => {
                flatpickr(input, {
                    dateFormat: "d/m/Y",
                    locale: "ar"
                });
            });

            // تحويل القيمة قبل الإرسال
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function (e) {
                    const inputs = this.querySelectorAll('input[type="text"][name*="date"], input[type="text"][name*="birth"]');
                    inputs.forEach(input => {
                        if (input.value && input.value.includes('/')) {
                            const [day, month, year] = input.value.split('/');
                            input.value = `${year}-${month}-${day}`;
                        }
                    });
                });
            });
        });
    </script>

</body>

</html>
