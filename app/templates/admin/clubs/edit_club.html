{% extends 'admin/base.html' %}

{% block content %}

<!-- Page Header -->
<div class="admin-header">
    <h1>✏️ Edit Club</h1>
    <p>Update club information</p>
</div>

<!-- Edit Club Form -->
<div class="admin-section">
    <h2>Club Information</h2>

    <form method="POST" class="admin-form">
        <div class="form-row">
            <div class="form-group">
                <label for="club_current_name">Club Name</label>
                <input type="text" id="club_current_name" name="club_current_name" value="{{ club.Club_Current_Name }}"
                    required>
            </div>

            <div class="form-group">
                <label for="club_short_name">Short Name</label>
                <input type="text" id="club_short_name" name="club_short_name" value="{{ club.Club_Short_Name }}"
                    maxlength="10" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city_id">City</label>
                <select id="city_id" name="city_id" required>
                    {% for city in cities %}
                    <option value="{{ city.City_id }}" {% if city.City_id==club.City_id %}selected{% endif %}>
                        {{ city.City_Name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="club_status">Status</label>
                <select id="club_status" name="club_status" required>
                    <option value="Active" {% if club.Club_Status=='Active' %}selected{% endif %}>🟢 Active</option>
                    <option value="Inactive" {% if club.Club_Status=='Inactive' %}selected{% endif %}>🟡 Inactive
                    </option>
                    <option value="Dissolved" {% if club.Club_Status=='Dissolved' %}selected{% endif %}>🔴 Dissolved
                    </option>
                    <option value="Suspended" {% if club.Club_Status=='Suspended' %}selected{% endif %}>⚫ Suspended
                    </option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="club_founding_date" class="optional">Founding Date</label>
                <input type="date" id="club_founding_date" name="club_founding_date"
                    value="{{ club.Club_Founding_Date or '' }}">
            </div>

            <div class="form-group">
                <label for="dissolution_date" class="optional">Dissolution Date</label>
                <input type="date" id="dissolution_date" name="dissolution_date"
                    value="{{ club.Dissolution_Date or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('clubs.clubs_page') }}" class="btn-secondary">← Back</a>
            <button type="submit" class="btn-primary">✓ Save Changes</button>
        </div>
    </form>
</div>

<!-- Danger Zone - Delete Club -->
<div class="admin-section" style="border-left: 4px solid var(--primary-red);">
    <h2 style="color: var(--primary-red);">⚠️ Danger Zone</h2>

    <div style="background: rgba(220, 20, 60, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <p style="margin: 0 0 10px 0; color: var(--primary-black);">
            <strong>Delete Club</strong><br>
            Deleting this club is permanent and cannot be undone.
        </p>

        <form method="POST" action="{{ url_for('edit_clubs.delete_club', club_id=club.Club_id) }}"
            onsubmit="return confirm('Are you absolutely sure? This action cannot be undone.');"
            style="display: inline;">
            <button type="submit" class="btn-danger">🗑️ Delete Club Permanently</button>
        </form>
    </div>
</div>

{% endblock %}
