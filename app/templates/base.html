<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USMA Admin{% if Title %} - {{ Title }}{% endif %}</title>

    <!-- CSS Reset & Variables -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">

    <!-- Component Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hero.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/content.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/squad.css') }}">
</head>

<body>

    <nav>
        <div class="logo">
            <a href="{{ url_for('main.home') }}">
                <img src="{{ url_for('static', filename='images/usma-logo-icon.png') }}" alt="USMA Archive">
            </a>
        </div>

        <div class="links">
            <a href="{{ url_for('main.home') }}">Home</a>
            <a href="{{ url_for('squad.squad_page') }}">Squad</a>
            <a href="{{ url_for('titles_history.titles_history_page') }}">Titles</a>
            <a href="#">About</a>
            <a href="{{ url_for('dashboard.dashboard_page') }}" class="admin-btn">👤 I am an Admin</a>
        </div>
    </nav>

    {% block body %}
    {% endblock %}

</body>

</html>
